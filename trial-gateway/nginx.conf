server {
    listen 80;
    server_name 113.219.170.192;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/xfriend-acme; }
    location / { return 301 https://113.219.170.192$request_uri; }
}

# Install only after the publicly trusted certificate has been issued.
server {
    listen 443 ssl;
    server_name 113.219.170.192;
    ssl_certificate /etc/letsencrypt/live/xfriend-trial-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xfriend-trial-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 30m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_read_timeout 640s;
        proxy_send_timeout 640s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
